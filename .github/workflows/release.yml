name: Release (Google Play)

# Builds the signed Android App Bundle (.aab) for Google Play, plus a signed APK for testing.
# Secrets needed (Settings › Secrets and variables › Actions), see play-store/README.md:
#   AGRIPEDIA_KEYSTORE_BASE64, AGRIPEDIA_SIGNING_STOREPASSWORD, AGRIPEDIA_SIGNING_KEYALIAS,
#   AGRIPEDIA_SIGNING_KEYPASSWORD, AGRIPEDIA_ADMOB_APPID, AGRIPEDIA_ADMOB_BANNERID
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check secrets
        env:
          KEYSTORE: ${{ secrets.AGRIPEDIA_KEYSTORE_BASE64 }}
          ADMOB_APP: ${{ secrets.AGRIPEDIA_ADMOB_APPID }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret AGRIPEDIA_KEYSTORE_BASE64 missing (see play-store/README.md)"; exit 1; fi
          if [ -z "$ADMOB_APP" ]; then echo "::warning::AdMob IDs not set: the release will show Google TEST ads"; fi
      - name: Decode upload key
        run: echo "${{ secrets.AGRIPEDIA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Validate and build
        env:
          AGRIPEDIA_SIGNING_STOREFILE: ${{ runner.temp }}/upload.jks
          AGRIPEDIA_SIGNING_STOREPASSWORD: ${{ secrets.AGRIPEDIA_SIGNING_STOREPASSWORD }}
          AGRIPEDIA_SIGNING_KEYALIAS: ${{ secrets.AGRIPEDIA_SIGNING_KEYALIAS }}
          AGRIPEDIA_SIGNING_KEYPASSWORD: ${{ secrets.AGRIPEDIA_SIGNING_KEYPASSWORD }}
          AGRIPEDIA_ADMOB_APPID: ${{ secrets.AGRIPEDIA_ADMOB_APPID }}
          AGRIPEDIA_ADMOB_BANNERID: ${{ secrets.AGRIPEDIA_ADMOB_BANNERID }}
        run: ./gradlew :core:test :app:bundleRelease :app:assembleRelease --stacktrace
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: agripedia-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
