name: Store screenshots

# Captures the Google Play screenshots on an emulator (fr, en, ar), frames them and
# regenerates the icon and feature graphics. On a branch other than main, the images are
# committed back to play-store/images/ (never on main: download the "play-store-images" artifact there).
on:
  workflow_dispatch:
  push:
    paths:
      - "play-store/scripts/**"
      - "app/src/androidTest/java/org/agripedia/app/StoreScreenshots.kt"
      - ".github/workflows/store-screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Capture on emulator (API 34, 1080x1920)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            for lang in fr en ar; do adb shell am instrument -w -e class org.agripedia.app.StoreScreenshots -e storeScreenshots true -e lang $lang com.aymen.agripedia.test/androidx.test.runner.AndroidJUnitRunner; done
            mkdir -p play-store/build/raw
            for lang in fr en ar; do adb pull /sdcard/Android/data/com.aymen.agripedia/files/store/$lang play-store/build/raw/$lang; done
            ls -R play-store/build/raw
            for lang in fr en ar; do n=$(ls play-store/build/raw/$lang 2>/dev/null | wc -l); if [ "$n" -ne 5 ]; then echo "::error::$lang: $n screenshots instead of 5"; exit 1; fi; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compose store images
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p play-store/build/fonts && cd play-store/build/fonts
          npm pack @fontsource/figtree@5.2.8 @fontsource/noto-kufi-arabic@5.2.8
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar -xzf "$f" -C "${f%.tgz}"; done
          cd ../../..
          node play-store/scripts/compose-images.js
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-images
          path: |
            play-store/images
            play-store/build/raw
      - name: Commit images to the branch
        if: github.ref_name != 'main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-store/images
          if git diff --cached --quiet; then echo "No image change"; exit 0; fi
          git commit -m "Update Play Store screenshots and images (store-screenshots workflow)"
          git push origin HEAD:${{ github.ref_name }}
