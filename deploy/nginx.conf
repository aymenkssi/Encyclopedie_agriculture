server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # /privacy serves privacy.html (the address given to Google Play and opened from the app).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /app-ads.txt {
        default_type text/plain;
    }
}
